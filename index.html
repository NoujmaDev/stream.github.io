<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zakia - Chat avec LLM</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
      color: #333;
    }
    .dark-mode {
      background-color: #1a1a1a;
      color: #f1f1f1;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: #f7f7f7;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
    }
    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
    }
    .sidebar ul li {
      padding: 10px;
      background: #e0e0e0;
      margin-bottom: 10px;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
    }
    .sidebar ul li:hover {
      background: #c0c0c0;
    }
    .menu-toggle {
      background: #007bff;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      position: absolute;
      top: 20px;
      left: 20px;
    }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px 30px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f9f9f9;
      height: calc(100vh - 220px);
      display: flex;
      flex-direction: column-reverse; /* Nouveauté : messages du plus récent au plus ancien */
    }
    .message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 25px;
      max-width: 70%;
    }
    .message.user {
      background-color: #007bff;
      color: white;
      align-self: flex-end;
      border-radius: 25px 25px 0 25px;
    }
    .message.llm {
      background-color: #e9e9eb;
      align-self: flex-start;
      border-radius: 25px 25px 25px 0;
    }
    .input-container {
      display: flex;
      align-items: center;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      margin-left: 10px;
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2>Menu</h2>
      <ul>
        <li onclick="showChat()"><i class="fas fa-comment-alt"></i> Chat</li>
        <li onclick="showNewChat()"><i class="fas fa-comments"></i> Nouveau Chat</li>
        <li onclick="showHistory()"><i class="fas fa-history"></i> Historique</li>
      </ul>
    </div>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <div class="chat-container">
      <div class="header">
        <h1>Zakia</h1>
        <button onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="input-container">
        <button onclick="uploadDocument()"><i class="fas fa-paperclip"></i></button>
        <button onclick="startVoiceRecognition()"><i class="fas fa-microphone"></i></button>
        <input type="text" id="userInput" placeholder="Posez une question..." onkeydown="handleKey(event)">
        <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        <button onclick="saveConversation()"><i class="fas fa-save"></i></button>
      </div>
    </div>
  </div>

  <script>
    function sendMessage() {
      let input = document.getElementById("userInput");
      let message = input.value.trim();
      if (message) {
        let messageElement = document.createElement("div");
        messageElement.classList.add("message", "user");
        messageElement.innerHTML = `<span>Vous:</span> ${message}`;
        document.getElementById("messages").prepend(messageElement);
        input.value = "";

        setTimeout(() => {
          let botMessage = generateBotResponse(message);
          typeWriter(botMessage);
        }, 1000);
      }
    }

    function generateBotResponse(userMessage) {
      if (userMessage.toLowerCase().includes("bonjour")) {
        return "Bonjour ! Comment puis-je vous aider ?";
      } else if (userMessage.toLowerCase().includes("comment ça va")) {
        return "Je vais bien, merci ! Et vous ?";
      } else {
        return "Désolé, je n'ai pas compris. Pouvez-vous reformuler ?";
      }
    }

    function typeWriter(text) {
      let index = 0;
      let botMessageElement = document.createElement("div");
      botMessageElement.classList.add("message", "llm");
      botMessageElement.innerHTML = `<span>Zakia:</span> <span id="typing"></span>`;
      document.getElementById("messages").prepend(botMessageElement);

      function addCharacter() {
        if (index < text.length) {
          document.getElementById("typing").innerHTML += text.charAt(index);
          index++;
          setTimeout(addCharacter, 50);
        }
      }
      addCharacter();
    }

    function handleKey(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    }

    function saveConversation() {
      const chatMessages = document.getElementById("messages").innerText;
      const blob = new Blob([chatMessages], { type: 'text/plain' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "conversation.txt";
      link.click();
    }
    
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    function toggleMenu() {
      document.querySelector(".sidebar").classList.toggle("hidden");
    }
  </script>
</body>
</html>
